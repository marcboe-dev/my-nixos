# Font
font_family      JetBrainsMono Nerd Font Mono
font_size        18.0

map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

confirm_os_window_close 0

# Fenster
window_padding_width 6
# background_opacity 0.9
enable_audio_bell no

# Tokyo Night (aus alacritty.toml übernommen)
background #1a1b26
foreground #c0caf5

# normal
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# bright
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

# ── kitty-scrollback.nvim ──────────────────────────────
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled

action_alias kitty_scrollback_nvim kitten /home/marc/.local/share/nvim/plugins/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Ctrl+Shift+Leertaste: gesamten Scrollback in Neovim öffnen
map kitty_mod+space kitty_scrollback_nvim
# Ctrl+Shift+Enter: nur die Ausgabe des letzten Befehls
# (überschreibt Kittys Standard "neues Kitty-Fenster")
map kitty_mod+enter kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Ctrl+Shift+Rechtsklick: Ausgabe des angeklickten Befehls
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
